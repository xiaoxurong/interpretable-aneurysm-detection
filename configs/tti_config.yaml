experiment:
  name: "IntrA_CCAM_PointPlusPlus_6d_input_TTI"
  task: "classification"
  ckpt_dir: "checkpoints/"
  output_dir: "tti_results/"

data:
  dataset_name: "IntrA"
  data_dir: "data/processed_IntrA_6d/points/"
  fold_dir: "data/processed_IntrA_6d/"
  concept_embeddings: "data/metadata/concept_embeds_ViT-B-32.pt"
  num_folds: 5

model:
  backbone: "PointNetPlusPlus"
  d_f: 128
  in_channel: 6
  d_t: 512
  d_hidden: 256
  num_concepts: 15
  num_classes: 2

tti:
  n_repeats: 20     # number of random concept orderings per fold
  batch_size: 256
  seed: 42