# Evaluate saved fold checkpoints. New checkpoints embed their own config, so
#   python scripts/evaluate.py --checkpoint_dir checkpoints/<run_name>
# is usually enough; this file is for checkpoints produced by the original code.
data:
  data_dir: data/processed_IntrA_6d/points/
  csv_dir: data/processed_IntrA_6d/
  concept_embeddings: data/metadata/concept_embeds.pt

model:
  backbone: OfficialPointNet     # must match the checkpoint
  d_f: 128
  d_hidden: 256
  num_classes: 2
  in_channel: 6

evaluation:
  checkpoint_dir: checkpoints/checkpoints_IntrA_PN_contrast
