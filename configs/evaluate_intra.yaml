experiment:
  name: "IntrA_CCAM_PPP_Focal_Loss_batch128_Sparse0.01_Ortho0.01_EVAL"
  task: "classification" # or "segmentation"

data:
  dataset_name: "IntrA"
  data_dir: "data/processed_IntrA_6d/points/"
  csv_dir: "data/processed_IntrA_6d/" # Pointing directly to the test split
  concept_embeddings: "data/metadata/concept_embeds.pt"

model:
  backbone: "OfficialPointNet" # Must match what the checkpoint was trained with
  d_f: 128
  d_hidden: 256
  num_classes: 2
  in_channel: 6

evaluation:
  batch_size: 256 # Can safely be double your training batch size without OOM errors
  checkpoint_dir: "checkpoints/checkpoints_IntrA_PN_contrast" # Path to the specific weights you want to evaluate